<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskflow — Task Tracker</title>
  <style>
    :root {
      --ink: #17231f;
      --muted: #65716d;
      --paper: #f5f2ea;
      --panel: #fffdf7;
      --line: #ddd8cc;
      --green: #166a50;
      --green-dark: #0d4f3b;
      --green-soft: #dceee7;
      --amber: #d88b25;
      --red: #b4483c;
      --shadow: 0 18px 60px rgba(31, 48, 41, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 0%, rgba(216, 139, 37, .12), transparent 25rem),
        linear-gradient(135deg, #f9f6ef 0%, #eef4ef 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--green);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 7px 0 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5vw, 4rem);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: .95;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .date-chip {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: rgba(255, 253, 247, .7);
      color: var(--muted);
      font-size: .88rem;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 17px 19px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 253, 247, .72);
    }

    .stat strong { display: block; font-family: Georgia, serif; font-size: 1.8rem; }
    .stat span { color: var(--muted); font-size: .8rem; }

    .workspace {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .form-panel { padding: 24px; position: sticky; top: 20px; }
    .form-panel h2, .list-head h2 { margin: 0; font-family: Georgia, serif; font-weight: 500; }
    .form-panel h2 { font-size: 1.45rem; }
    .form-note { margin: 6px 0 20px; color: var(--muted); font-size: .86rem; }

    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: .78rem; font-weight: 750; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 11px 12px;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea { min-height: 92px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

    .error {
      min-height: 18px;
      margin: -6px 0 8px;
      color: var(--red);
      font-size: .78rem;
    }

    .actions { display: flex; gap: 9px; }

    .primary, .secondary, .danger, .icon-button {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-weight: 750;
    }

    .primary { flex: 1; background: var(--green); color: #fff; }
    .primary:hover { background: var(--green-dark); }
    .secondary { background: #ece9e0; color: var(--ink); }
    .secondary:hover { background: #e1ddd2; }
    .danger { background: #fae6e2; color: var(--red); }

    .list-panel { overflow: hidden; }
    .list-head { padding: 22px 24px 17px; border-bottom: 1px solid var(--line); }
    .list-title-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .task-count { color: var(--muted); font-size: .84rem; }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 9px;
      margin-top: 16px;
    }

    .filters input, .filters select { padding: 9px 10px; font-size: .86rem; }
    .task-list { padding: 10px; }

    .task {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      padding: 17px 15px;
      border-bottom: 1px solid #e8e4da;
    }

    .task:last-child { border-bottom: 0; }
    .task-title { margin: 0 0 5px; font-size: 1rem; }
    .task-description { margin: 0 0 12px; color: var(--muted); font-size: .86rem; line-height: 1.45; white-space: pre-wrap; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 99px;
      background: #eceae3;
      color: #4c5753;
      font-size: .7rem;
      font-weight: 750;
      text-transform: capitalize;
    }

    .pill.todo { background: #e8e7e1; }
    .pill.in_progress { background: #fff0d8; color: #855516; }
    .pill.done { background: var(--green-soft); color: var(--green-dark); }
    .pill.high { background: #fae4e0; color: #97392f; }
    .pill.medium { background: #fff0d8; color: #855516; }
    .pill.low { background: #e5eef5; color: #315d7c; }
    .pill.overdue { background: #fae4e0; color: #97392f; }
    .due-date { color: var(--muted); font-size: .75rem; }
    .assignee { color: var(--muted); font-size: .75rem; }

    .task-actions { display: flex; flex-direction: column; align-items: stretch; gap: 7px; min-width: 112px; }
    .task-actions select { padding: 7px; font-size: .74rem; }
    .task-actions button { padding: 7px 10px; font-size: .73rem; }

    .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-family: Georgia, serif; font-size: 1.25rem; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: min(360px, calc(100% - 40px));
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .2s ease;
      font-size: .84rem;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 850px) {
      .workspace { grid-template-columns: 1fr; }
      .form-panel { position: static; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 24px; }
      header { align-items: flex-start; flex-direction: column; }
      .date-chip { display: none; }
      .filters { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; gap: 0; }
      .task { grid-template-columns: 1fr; }
      .task-actions { flex-direction: row; flex-wrap: wrap; }
      .task-actions select { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Personal workspace</div>
        <h1>Taskflow</h1>
        <p class="subtitle">Turn intentions into finished work.</p>
      </div>
      <div class="date-chip" id="today"></div>
    </header>

    <section class="stats" aria-label="Task summary">
      <div class="stat"><strong id="totalStat">0</strong><span>Total tasks</span></div>
      <div class="stat"><strong id="todoStat">0</strong><span>To do</span></div>
      <div class="stat"><strong id="progressStat">0</strong><span>In progress</span></div>
      <div class="stat"><strong id="doneStat">0</strong><span>Completed</span></div>
    </section>

    <section class="workspace">
      <form class="panel form-panel" id="taskForm" novalidate>
        <h2 id="formTitle">Create a task</h2>
        <p class="form-note" id="formNote">Add the details that make the next step clear.</p>
        <input type="hidden" id="taskId">

        <div class="field">
          <label for="title">Title *</label>
          <input id="title" maxlength="100" placeholder="e.g. Draft project outline" required>
        </div>
        <div class="error" id="titleError" role="alert"></div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" maxlength="1000" placeholder="Add useful context or a definition of done"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="todo">To do</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="assignee">Assignee</label>
          <input id="assignee" maxlength="100" placeholder="Name or team">
        </div>

        <div class="field">
          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate">
        </div>

        <div class="error" id="formError" role="alert"></div>
        <div class="actions">
          <button class="primary" type="submit" id="saveButton">Add task</button>
          <button class="secondary" type="button" id="cancelButton" hidden>Cancel</button>
        </div>
      </form>

      <section class="panel list-panel">
        <div class="list-head">
          <div class="list-title-row">
            <h2>Your tasks</h2>
            <span class="task-count" id="taskCount">0 shown</span>
          </div>
          <div class="filters" aria-label="Task filters">
            <input type="search" id="searchFilter" placeholder="Search tasks" aria-label="Search tasks">
            <select id="statusFilter" aria-label="Filter by status">
              <option value="all">All statuses</option>
              <option value="todo">To do</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
            <select id="priorityFilter" aria-label="Filter by priority">
              <option value="all">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <select id="overdueFilter" aria-label="Filter overdue tasks">
              <option value="all">Any due date</option>
              <option value="true">Overdue only</option>
              <option value="false">Not overdue</option>
            </select>
          </div>
        </div>
        <div class="task-list" id="taskList"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="text/plain">
    "use strict";

    const STORAGE_KEY = "taskflow.tasks.v1";
    const ALLOWED_TRANSITIONS = {
      todo: ["todo", "in_progress", "done"],
      in_progress: ["in_progress", "done"],
      done: ["done"]
    };

    const el = (id) => document.getElementById(id);
    const form = el("taskForm");
    let tasks = loadTasks();
    let toastTimer;

    el("today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }).format(new Date());

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function label(value) {
      return value === "in_progress" ? "In progress" : value.replace("_", " ");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      el("toast").textContent = message;
      el("toast").classList.add("show");
      toastTimer = setTimeout(() => el("toast").classList.remove("show"), 2600);
    }

    function nextId() {
      return tasks.reduce((highest, task) => Math.max(highest, Number(task.id) || 0), 0) + 1;
    }

    function resetForm() {
      form.reset();
      el("taskId").value = "";
      el("priority").value = "medium";
      el("status").value = "todo";
      el("formTitle").textContent = "Create a task";
      el("formNote").textContent = "Add the details that make the next step clear.";
      el("saveButton").textContent = "Add task";
      el("cancelButton").hidden = true;
      el("titleError").textContent = "";
      el("formError").textContent = "";
      [...el("status").options].forEach(option => option.disabled = false);
    }

    function render() {
      el("totalStat").textContent = tasks.length;
      el("todoStat").textContent = tasks.filter(t => t.status === "todo").length;
      el("progressStat").textContent = tasks.filter(t => t.status === "in_progress").length;
      el("doneStat").textContent = tasks.filter(t => t.status === "done").length;

      const search = el("searchFilter").value.trim().toLowerCase();
      const status = el("statusFilter").value;
      const priority = el("priorityFilter").value;
      const visible = tasks.filter(task => {
        const haystack = `${task.title} ${task.description || ""} ${task.assignee || ""}`.toLowerCase();
        return (!search || haystack.includes(search))
          && (status === "all" || task.status === status)
          && (priority === "all" || task.priority === priority);
      });

      el("taskCount").textContent = `${visible.length} shown`;
      if (!visible.length) {
        el("taskList").innerHTML = `<div class="empty"><strong>No tasks found</strong>${tasks.length ? "Try adjusting your filters." : "Create your first task to get moving."}</div>`;
        return;
      }

      el("taskList").innerHTML = visible.map(task => {
        const available = ALLOWED_TRANSITIONS[task.status];
        const statusOptions = ["todo", "in_progress", "done"].map(value =>
          `<option value="${value}" ${value === task.status ? "selected" : ""} ${available.includes(value) ? "" : "disabled"}>${label(value)}</option>`
        ).join("");
        return `
          <article class="task" data-id="${task.id}">
            <div>
              <h3 class="task-title">${escapeHtml(task.title)}</h3>
              ${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ""}
              <div class="meta">
                <span class="pill ${task.status}">${label(task.status)}</span>
                <span class="pill ${task.priority}">${task.priority}</span>
                ${task.assignee ? `<span class="assignee">Assigned to ${escapeHtml(task.assignee)}</span>` : ""}
              </div>
            </div>
            <div class="task-actions">
              <select data-action="status" aria-label="Change status for ${escapeHtml(task.title)}">${statusOptions}</select>
              <button class="secondary" type="button" data-action="edit">Edit</button>
              <button class="danger" type="button" data-action="delete">Delete</button>
            </div>
          </article>`;
      }).join("");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      el("titleError").textContent = "";
      el("formError").textContent = "";
      const title = el("title").value.trim();
      if (!title) {
        el("titleError").textContent = "Enter a title that is not only whitespace.";
        el("title").focus();
        return;
      }

      const editingId = Number(el("taskId").value);
      const existing = tasks.find(task => task.id === editingId);
      const newStatus = el("status").value;
      if (existing && !ALLOWED_TRANSITIONS[existing.status].includes(newStatus)) {
        el("formError").textContent = `A ${label(existing.status)} task cannot move back to ${label(newStatus)}.`;
        return;
      }

      const task = {
        id: existing ? existing.id : nextId(),
        title,
        description: el("description").value.trim() || null,
        status: newStatus,
        priority: el("priority").value,
        assignee: el("assignee").value.trim() || null
      };

      if (existing) {
        tasks = tasks.map(item => item.id === existing.id ? task : item);
        showToast("Task updated");
      } else {
        tasks.unshift(task);
        showToast("Task created");
      }
      saveTasks();
      resetForm();
      render();
    });

    el("cancelButton").addEventListener("click", resetForm);
    ["searchFilter", "statusFilter", "priorityFilter"].forEach(id => el(id).addEventListener("input", render));

    el("taskList").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const card = button.closest(".task");
      const id = Number(card.dataset.id);
      const task = tasks.find(item => item.id === id);
      if (!task) return;

      if (button.dataset.action === "delete") {
        if (!confirm(`Delete “${task.title}”?`)) return;
        tasks = tasks.filter(item => item.id !== id);
        saveTasks();
        if (Number(el("taskId").value) === id) resetForm();
        render();
        showToast("Task deleted");
      }

      if (button.dataset.action === "edit") {
        el("taskId").value = task.id;
        el("title").value = task.title;
        el("description").value = task.description || "";
        el("status").value = task.status;
        el("priority").value = task.priority;
        el("assignee").value = task.assignee || "";
        [...el("status").options].forEach(option => option.disabled = !ALLOWED_TRANSITIONS[task.status].includes(option.value));
        el("formTitle").textContent = "Edit task";
        el("formNote").textContent = `Updating task #${task.id}`;
        el("saveButton").textContent = "Save changes";
        el("cancelButton").hidden = false;
        el("title").focus();
        if (window.innerWidth < 850) form.scrollIntoView({ behavior: "smooth" });
      }
    });

    el("taskList").addEventListener("change", (event) => {
      if (event.target.dataset.action !== "status") return;
      const id = Number(event.target.closest(".task").dataset.id);
      const task = tasks.find(item => item.id === id);
      const next = event.target.value;
      if (!task || !ALLOWED_TRANSITIONS[task.status].includes(next)) {
        render();
        showToast("That status transition is not allowed");
        return;
      }
      task.status = next;
      saveTasks();
      render();
      showToast(`Moved to ${label(next)}`);
    });

    render();
  </script>
  <script src="/app.js"></script>
</body>
</html>
